<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e22">
<title>NeuroNet V2 · Brain Training</title>
<link rel="stylesheet" href="./play.css">
<script type="module" src="./map.js"></script>
</head>
<body>
<main class="entry">
  <section id="welcome" class="card" aria-labelledby="welcome-title">
    <h1 id="welcome-title">NeuroNet</h1>
    <form id="player-form">
      <label for="display-name">Display name</label>
      <input id="display-name" type="text" maxlength="40" required>
      <button type="submit">Continue</button>
    </form>
  </section>
  <nav class="brain-map" id="brain-map" aria-label="Brain regions" hidden>
    <span class="region" style="--region:#b88afd">Focus <small>Unavailable</small></span>
    <span class="region" style="--region:#7bb4ff">Memory <small>Unavailable</small></span>
    <span class="region" style="--region:#92ddff">Problem Solving <small>Unavailable</small></span>
    <span class="region" style="--region:#c4a1ff">Numerical Reasoning <small>Unavailable</small></span>
    <span class="region" style="--region:#f4a8f6">Language <small>Unavailable</small></span>
    <a class="region" style="--region:#c08fff" href="./pattern-recognition.html">Pattern Recognition <small>Play</small></a>
    <span class="region" style="--region:#f6acbd">Creativity <small>Unavailable</small></span>
    <span class="region" style="--region:#86e5d5">Spatial Reasoning <small>Unavailable</small></span>
    <span class="region" style="--region:#f7bc9b">Social / Emotional Skills <small>Unavailable</small></span>
    <span class="region" style="--region:#aee8a1">Reaction Speed <small>Unavailable</small></span>
  </nav>
</main>
</body>
</html>
